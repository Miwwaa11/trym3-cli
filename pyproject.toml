[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctftools"
version = "1.0.0"
description = "Unified launcher for the CTF CLI tools suite."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["click>=8.0"]

[project.scripts]
tryme = "ctftools.cli:main"

[tool.setuptools]
packages = ["ctftools"]